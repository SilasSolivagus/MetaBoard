<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="内容轨迹：两个轮次的工具调用，中间夹一次人工评审，派生边显示每个产物来自哪些上游">
