  <path d="M 470,622 H 500" fill="none" stroke="#D19AA2" stroke-width="1.4" marker-end="url(#mb-rose)"/>
  <text x="510" y="626" font-size="11.5" fill="#ADB2B8">人发起，走 <tspan class="m" fill="#F9FAFB">user/message</tspan></text>
