<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="架构：MetaBoard 的工具和评审写入器产生核心会话事件，共享的会话装配器供给 Chat、Trajectory、MetaBoard 三套 Definition，各自渲染自己的标签页">
  <defs>
    <marker id="ar-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#679EFE"/>
    </marker>
    <marker id="ar-grey" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6E767F"/>
    </marker>
  </defs>
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif} .m{font-family:'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'PingFang SC', monospace}</style>
  <rect width="960" height="600" fill="#151517"/>
  <text x="36" y="48" font-size="19" font-weight="600" fill="#F9FAFB">怎么拼起来的</text>
  <text x="36" y="70" font-size="13" fill="#ADB2B8">蓝色是这个包，灰色全是 DeepSeek Harness，一行没改。</text>
  <path d="M 156,174 V 230" fill="none" stroke="#6E767F" stroke-width="1.4" marker-end="url(#ar-grey)"/>
  <text x="167" y="206" font-size="10.5" class="m" fill="#6E767F">turn/start · step/start</text>
  <path d="M 480,174 V 230" fill="none" stroke="#679EFE" stroke-width="1.4" marker-end="url(#ar-blue)"/>
  <text x="491" y="206" font-size="10.5" class="m" fill="#679EFE">tool/call + tool/result.meta</text>
  <path d="M 804,174 V 230" fill="none" stroke="#679EFE" stroke-width="1.4" marker-end="url(#ar-blue)"/>
  <text x="815" y="206" font-size="10.5" class="m" fill="#679EFE">user/message</text>
  <path d="M 480,288 V 338" fill="none" stroke="#6E767F" stroke-width="1.4" marker-end="url(#ar-grey)"/>
  <path d="M 184,404 V 450" fill="none" stroke="#6E767F" stroke-width="1.4" marker-end="url(#ar-grey)"/>
  <path d="M 504,404 V 450" fill="none" stroke="#6E767F" stroke-width="1.4" marker-end="url(#ar-grey)"/>
  <path d="M 800,404 V 450" fill="none" stroke="#679EFE" stroke-width="1.4" marker-end="url(#ar-blue)"/>
  <rect x="36" y="106" width="240" height="68" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="36" y="106" width="3" height="68" rx="1.5" fill="#6E767F"/>
  <text x="56" y="133" font-size="13.5" font-weight="600" fill="#F9FAFB">Agent 循环</text>
  <text x="260" y="131" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#6E767F">dsh</text>
  <text x="56" y="152" font-size="11" fill="#81858C">开合轮次与步骤</text>
  <rect x="300" y="106" width="360" height="68" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="300" y="106" width="3" height="68" rx="1.5" fill="#679EFE"/>
  <text x="320" y="133" font-size="13.5" font-weight="600" fill="#F9FAFB">MetaBoard 工具</text>
  <text x="644" y="131" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#679EFE">MetaBoard</text>
  <text x="320" y="152" font-size="11" fill="#81858C">检索 · 起稿 · 改稿</text>
  <text x="320" y="168" font-size="11" fill="#81858C">领域载荷挂在 meta 上</text>
  <rect x="684" y="106" width="240" height="68" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="684" y="106" width="3" height="68" rx="1.5" fill="#679EFE"/>
  <text x="704" y="133" font-size="13.5" font-weight="600" fill="#F9FAFB">评审写入器</text>
  <text x="908" y="131" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#679EFE">MetaBoard</text>
  <text x="704" y="152" font-size="11" fill="#81858C">人工决策</text>
  <rect x="36" y="230" width="888" height="58" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="36" y="230" width="3" height="58" rx="1.5" fill="#6E767F"/>
  <text x="56" y="257" font-size="13.5" font-weight="600" fill="#F9FAFB">Session</text>
  <text x="908" y="255" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#6E767F">dsh</text>
  <text x="56" y="276" font-size="11" fill="#81858C">一条 append-only 事件日志 —— MetaBoard 没往里加任何事件类型</text>
  <rect x="36" y="338" width="888" height="66" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="36" y="338" width="3" height="66" rx="1.5" fill="#6E767F"/>
  <text x="56" y="365" font-size="13.5" font-weight="600" fill="#F9FAFB">ConversationNodeAssembler</text>
  <text x="908" y="363" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#6E767F">dsh</text>
  <text x="56" y="384" font-size="11" fill="#81858C">从单个事件抽出业务 ID  →  折叠状态  →  产出视图节点</text>
  <text x="56" y="400" font-size="11" fill="#81858C">新加载的旧页只重放答案发生变化的 Context</text>
  <rect x="36" y="450" width="296" height="58" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="36" y="450" width="3" height="58" rx="1.5" fill="#6E767F"/>
  <text x="56" y="477" font-size="13.5" font-weight="600" fill="#F9FAFB">Chat Definition</text>
  <text x="316" y="475" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#6E767F">dsh</text>
  <text x="56" y="496" font-size="11" fill="#81858C">→ 对话标签页</text>
  <rect x="356" y="450" width="296" height="58" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="356" y="450" width="3" height="58" rx="1.5" fill="#6E767F"/>
  <text x="376" y="477" font-size="13.5" font-weight="600" fill="#F9FAFB">Trajectory Definition</text>
  <text x="636" y="475" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#6E767F">dsh</text>
  <text x="376" y="496" font-size="11" fill="#81858C">→ 轨迹标签页</text>
  <rect x="676" y="450" width="248" height="58" rx="7" fill="#232324" stroke="#34343A" stroke-width="1"/>
  <rect x="676" y="450" width="3" height="58" rx="1.5" fill="#679EFE"/>
  <text x="696" y="477" font-size="13.5" font-weight="600" fill="#F9FAFB">MetaBoard Definition</text>
  <text x="908" y="475" text-anchor="end" font-size="9.5" class="m" letter-spacing="0.5" fill="#679EFE">MetaBoard</text>
  <text x="696" y="496" font-size="11" fill="#81858C">→ 内容轨迹标签页</text>
  <line x1="36" y1="546" x2="924" y2="546" stroke="#34343A" stroke-width="1"/>
  <text x="36" y="570" font-size="12" fill="#ADB2B8">三个 target 读同一个事件窗口。各持各的状态和节点，互相不知道对方存在。</text>
</svg>